syntax = "proto3";

option csharp_namespace = "VYUH.Ingestion.Infrastructure.Protos";

package ganesh;

service GaneshService {
  rpc GetHistoricalReturns (HistoricalReturnsRequest) returns (HistoricalReturnsResponse);
}

message HistoricalReturnsRequest {
  string stock_id = 1;
  int32 period_days = 2;
}

message HistoricalReturnRecord {
  string date = 1;
  double close_price = 2;
  double log_return = 3;
}

message HistoricalReturnsResponse {
  string stock_id = 1;
  repeated HistoricalReturnRecord records = 2;
}
